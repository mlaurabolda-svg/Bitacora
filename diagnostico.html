<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico de Micrófono</title>
<style>
  body{font-family:-apple-system,Roboto,sans-serif; padding:20px; background:#16262c; color:#f6f3ea; line-height:1.6;}
  h1{font-size:20px;}
  button{width:100%; padding:16px; font-size:16px; border-radius:10px; border:none; background:#b23a2e; color:#fff; margin:16px 0; cursor:pointer;}
  .box{background:#1e363f; border-radius:10px; padding:14px; margin-top:14px; font-family:monospace; font-size:13px; white-space:pre-wrap; word-break:break-word;}
  .ok{color:#8fd19e;}
  .err{color:#ff8a80;}
  .info{color:#c9973e; font-size:13px; margin-top:10px;}
</style>
</head>
<body>
  <h1>🎙️ Diagnóstico de micrófono</h1>
  <p>Esta página solo prueba si el navegador puede acceder al micrófono. No graba ni guarda nada.</p>
  <button id="testBtn">Probar acceso al micrófono</button>
  <button id="testRecBtn" style="background:#c9973e;">Probar grabación (MediaRecorder)</button>
  <div class="box" id="result">Tocá el botón para empezar.</div>
  <div class="box" id="result2" style="display:none;">-</div>
<script>
const result = document.getElementById('result');
document.getElementById('testBtn').addEventListener('click', async () => {
  result.className = 'box';
  result.textContent = 'Pidiendo permiso...';
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    result.className = 'box ok';
    result.textContent = '✅ ÉXITO. Micrófono abierto correctamente.';
    stream.getTracks().forEach(t => t.stop());
  }catch(err){
    result.className = 'box err';
    result.textContent = '❌ ERROR\n\nNombre: ' + err.name + '\nMensaje: ' + err.message;
  }
});
const result2 = document.getElementById('result2');
document.getElementById('testRecBtn').addEventListener('click', async () => {
  result2.style.display = 'block';
  result2.className = 'box';
  result2.textContent = 'Probando MediaRecorder...';
  if(typeof MediaRecorder === 'undefined'){
    result2.className = 'box err';
    result2.textContent = '❌ Este navegador NO tiene MediaRecorder disponible.';
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    let mr;
    try{
      mr = new MediaRecorder(stream);
    }catch(errCtor){
      result2.className = 'box err';
      result2.textContent = '❌ ERROR AL CREAR MediaRecorder\n\nNombre: ' + errCtor.name + '\nMensaje: ' + errCtor.message;
      stream.getTracks().forEach(t=>t.stop());
      return;
    }
    let gotData = false;
    mr.ondataavailable = (e)=>{ if(e.data && e.data.size>0) gotData = true; };
    mr.onerror = (e)=>{
      result2.className = 'box err';
      result2.textContent = '❌ ERROR DURANTE LA GRABACIÓN\n\n' + (e.error ? (e.error.name + ': ' + e.error.message) : JSON.stringify(e));
    };
    mr.onstop = ()=>{
      if(result2.className.indexOf('err') === -1){
        result2.className = 'box ok';
        result2.textContent = '✅ ÉXITO. Grabó 2 segundos de audio correctamente.\n\nDatos recibidos: ' + (gotData ? 'Sí' : 'No') + '\nmimeType: ' + mr.mimeType;
      }
      stream.getTracks().forEach(t=>t.stop());
    };
    mr.start();
    result2.textContent = 'Grabando 2 segundos de prueba...';
    setTimeout(()=>{ try{ mr.stop(); }catch(_){} }, 2000);
  }catch(err){
    result2.className = 'box err';
    result2.textContent = '❌ ERROR\n\nNombre: ' + err.name + '\nMensaje: ' + err.message;
  }
});
</script>
</body>
</html>
